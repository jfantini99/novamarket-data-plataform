acceptance_criteria:
- Medição antes/depois (tempo, memória, requisições)
- Estratégia de paralelismo respeitando pools e a API
- Estimativa de custo na AWS e justificativa de tamanho de arquivo/partição
- Sem regressão de qualidade (data quality verde)
notes:
- Gere dados com `novamarket data generate --scale medium`.
definition_of_done:
- Código revisado (ruff limpo) e com testes
- 'Idempotente: reexecutar a mesma janela não duplica dados'
- Instrumentado (pipeline_run) e com SLA em configs/sla.yaml
- Documentação atualizada
hints:
- 'Meça primeiro. Onde está o tempo: rede, parse, escrita ou espera de pool?'
